  /* ---------- lang bar ---------- */
  .langbar{
    position:sticky; top:0; top:env(safe-area-inset-top,0px); z-index:50;
    background:var(--deep); color:#EDEAE0;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px; padding-top:calc(10px + env(safe-area-inset-top,0px));
    border-bottom:1px solid rgba(237,234,224,0.15);
  }
  .langbar .brand{ font-family:Georgia,serif; font-weight:700; letter-spacing:0.5px; font-size:15px; }
  .langtabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .langtabs button{
    background:transparent; border:1px solid rgba(237,234,224,0.35);
    color:#D8D3C4; font-size:12px; padding:6px 11px; border-radius:999px;
    cursor:pointer; font-family:inherit; letter-spacing:0.3px;
    transition:background .15s ease, color .15s ease;
  }
  .langtabs button.active{ background:var(--gold); border-color:var(--gold); color:#1A1408; font-weight:700; }
  .langtabs button:hover:not(.active){ border-color:var(--gold-soft); color:#F4F1E8; }

  section{ padding:56px 20px; max-width:760px; margin:0 auto; }
  .kicker{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:26px;
    font-size:12px; color:var(--slate); letter-spacing:0.5px;
  }
  .kicker .mark{ color:var(--ink); font-weight:700; }
  .rule{ height:1px; background:var(--line); margin:22px 0; border:0; }

  /* ---------- hero / cover ---------- */
  .hero{
    background:linear-gradient(180deg, var(--deep) 0%, var(--deep-2) 100%);
    color:#EDEAE0; padding:64px 20px 48px;
  }
  .hero .inner{ max-width:760px; margin:0 auto; }
  .hero .topline{
    display:flex; justify-content:space-between; font-size:12px;

  .hero .word{ font-family:Georgia,serif; font-weight:700; font-size:32px; margin-top:34px; color:#F4F1E8; }
  .hero .tagline{ font-size:16px; color:#C9C4B6; margin-top:10px; max-width:480px; }
  .hero .bottomline{
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
    border-top:1px solid rgba(237,234,224,0.25); padding-top:16px; margin-top:44px;
    font-size:12px; color:#B8B2A2;
  }

  .subtitle{ color:var(--slate); font-size:15px; margin-bottom:28px; }
  p{ margin:0 0 14px 0; }
  .lead{ font-size:17px; line-height:1.7; color:#22262E; }

  .stat-row{ display:flex; flex-wrap:wrap; gap:24px; margin-top:24px; }
  .stat{ flex:1 1 140px; border-top:2px solid var(--gold); padding-top:10px; }
  .stat .num{ font-family:Georgia,serif; font-weight:700; font-size:20px; }
  .stat .lbl{ font-size:11px; color:var(--slate); margin-top:3px; letter-spacing:0.3px; }

  table.specs{ width:100%; border-collapse:collapse; margin-top:10px; }
  table.specs td{ padding:14px 0; border-bottom:1px solid var(--line); font-size:14.5px; vertical-align:top; }
  table.specs td.k{ width:38%; color:var(--slate); padding-right:12px; }
  table.specs td.v{ font-weight:700; }
  table.specs td.mono{ font-family:"Courier New",monospace; font-size:12.5px; font-weight:400; word-break:break-all; }

  .bar{ display:flex; width:100%; height:34px; border:1px solid var(--ink); margin-top:20px; border-radius:3px; overflow:hidden; }
  .seg{ height:100%; display:flex; align-items:center; justify-content:center; font-size:11px; color:#FAF8F3; overflow:hidden; white-space:nowrap; }

  table.token{ width:100%; border-collapse:collapse; margin-top:26px; }
  table.token th{ text-align:left; font-size:11px; color:var(--slate); font-weight:400; border-bottom:2px solid var(--ink); padding-bottom:8px; letter-spacing:0.3px; }
  table.token td{ padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; }
  table.token td.sw{ width:20px; }
  table.token .chip{ width:11px; height:11px; display:inline-block; border-radius:2px; }
  table.token td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  table.token td:nth-child(2){ padding-right:10px; }

  .phase{ display:flex; gap:22px; margin-bottom:30px; }
  .phase .idx{ font-family:Georgia,serif; font-weight:700; font-size:26px; color:var(--gold); width:44px; flex-shrink:0; border-right:2px solid var(--line); padding-right:16px; }
  .phase .body h3{ font-size:19px; margin-bottom:4px; }

  .phase ul{ margin:6px 0 0 0; padding-left:18px; }
  .phase li{ margin-bottom:5px; font-size:14.5px; }

  .roles{ display:flex; flex-wrap:wrap; gap:24px; margin-top:24px; }
  .role{ flex:1 1 180px; border-top:2px solid var(--ink); padding-top:12px; }
  .role h3{ font-size:16px; margin-bottom:6px; }
  .role p{ font-size:13.5px; color:#3A3F47; margin:0; }

  .disclaimer{ margin-top:36px; background:#F1ECDF; border:1px solid var(--line); border-radius:4px; padding:18px 20px; font-size:12.5px; color:var(--slate); line-height:1.6; }
  .disclaimer strong{ color:var(--ink); }

  .closing{ background:linear-gradient(180deg, var(--deep) 0%, var(--deep-2) 100%); color:#EDEAE0; padding:64px 20px; }

  .closing .tagline2{ font-size:14px; color:#C9C4B6; }

  footer.foot{ text-align:center; font-size:11px; color:var(--slate); padding:24px 20px 40px; }

  @media (prefers-color-scheme: dark){
    body{ background:#0F1216; color:#E7E5DE; }

    table.specs td, table.token td{ border-bottom-color:#2A2E35; }
    .lead{ color:#E7E5DE; }
    .role p{ color:#C7C9CE; }
  }
</style>

const BAR_COLORS = ["#131C2E","#1C2A45","#AD8A3D","#8B7449","#5B6472","#8A93A0"];
const BAR_WIDTHS = [35,30,15,10,5,5];

function fill(str, nums){
  return str.replace(/\{(\w+)\}/g, (_,k)=> nums[k] ?? "");
}

function render(lang){
  const t = T[lang];
  const nums = NUMS[lang];
  document.documentElement.lang = lang;

  document.getElementById('cv-supply').textContent = nums.supply;
  document.getElementById('cv-supplylbl').textContent = t.cover.supplylbl;
  document.getElementById('cv-k1').textContent = t.cover.k1;
  document.getElementById('cv-k2').textContent = t.cover.k2;
  document.getElementById('cv-tagline').textContent = t.cover.tagline;
  document.getElementById('cv-b1').textContent = t.cover.b1;
  document.getElementById('cv-b2').textContent = t.cover.b2;
  document.getElementById('cv-b3').textContent = t.cover.b3;

  document.getElementById('v-kicker').textContent = t.vision.kicker;
  document.getElementById('v-title').textContent = t.vision.title;
  document.getElementById('v-sub').textContent = t.vision.sub;
  document.getElementById('v-p1').textContent = t.vision.p1;
  document.getElementById('v-p2').textContent = t.vision.p2;
  document.getElementById('v-p3').textContent = t.vision.p3;
  document.getElementById('v-s1n').textContent = t.vision.s1n;
  document.getElementById('v-s1l').textContent = t.vision.s1l;
  document.getElementById('v-s2n').textContent = t.vision.s2n;
  document.getElementById('v-s2l').textContent = t.vision.s2l;
  document.getElementById('v-s3n').textContent = t.vision.s3n;
  document.getElementById('v-s3l').textContent = t.vision.s3l;

  document.getElementById('s-kicker').textContent = t.specs.kicker;
  document.getElementById('s-title').textContent = t.specs.title;
  document.getElementById('s-sub').textContent = t.specs.sub;
  const sTable = document.getElementById('s-table');
  sTable.innerHTML = t.specs.rows.map(r=>{
    const val = fill(r[1], nums);
    const cls = r[2] ? "v mono" : "v";
    return `<tr><td class="k">${r[0]}</td><td class="${cls}">${val}</td></tr>`;
  }).join('');
  document.getElementById('s-foot').textContent = t.specs.foot;

  document.getElementById('t-kicker').textContent = t.token.kicker;
  document.getElementById('t-title').textContent = t.token.title;
  document.getElementById('t-sub').textContent = fill(t.token.sub, nums);
  const bar = document.getElementById('t-bar');
  bar.innerHTML = t.token.bar.map((label,i)=>`<div class="seg" style="width:${BAR_WIDTHS[i]}%;background:${BAR_COLORS[i]};"><span>${label}</span></div>`).join('')
    + `<div class="seg" style="width:${BAR_WIDTHS[4]}%;background:${BAR_COLORS[4]};"></div>`
    + `<div class="seg" style="width:${BAR_WIDTHS[5]}%;background:${BAR_COLORS[5]};"></div>`;
  const tTable = document.getElementById('t-table');
  let rowsHtml = `<tr><th>${t.token.headers[0]}</th><th></th><th style="text-align:right;">${t.token.headers[1]}</th><th style="text-align:right;">${t.token.headers[2]}</th></tr>`;
  t.token.rows.forEach((r,i)=>{
    const isTotal = i === t.token.rows.length-1;
    const swatch = isTotal ? '' : `<span class="chip" style="background:${BAR_COLORS[i]};"></span>`;
    const bold = isTotal ? 'style="font-weight:700;"' : '';
    rowsHtml += `<tr><td class="sw">${swatch}</td><td ${bold}>${r[0]}</td><td class="num" ${bold}>${r[1]}</td><td class="num" ${bold}>${fill(r[2],nums)}</td></tr>`;
  });
  tTable.innerHTML = rowsHtml;
  document.getElementById('t-foot').textContent = t.token.foot;

  document.getElementById('r-kicker').textContent = t.road.kicker;
  document.getElementById('r-title').textContent = t.road.title;
  document.getElementById('r-sub').textContent = t.road.sub;
  const rphases = document.getElementById('r-phases');
  rphases.innerHTML = t.road.phases.map((p,i)=>`
    <div class="phase">
      <div class="idx">${String(i+1).padStart(2,'0')}</div>
      <div class="body">
        <div class="stage">${p.stage}</div>
        <h3>${p.title}</h3>
        <ul>${p.items.map(it=>`<li>${it}</li>`).join('')}</ul>
      </div>
    </div>`).join('');

  document.getElementById('e-kicker').textContent = t.team.kicker;
  document.getElementById('e-title').textContent = t.team.title;
  document.getElementById('e-sub').textContent = t.team.sub;
  document.getElementById('e-lead').textContent = t.team.lead;
  document.getElementById('e-roles').innerHTML = t.team.roles.map(r=>`<div class="role"><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join('');
  document.getElementById('e-disc-label').textContent = t.team.discLabel;
  document.getElementById('e-disc-text').textContent = t.team.discText;

  document.getElementById('c-t1').textContent = t.closing.t1;
  document.getElementById('c-t2').textContent = t.closing.t2;
  document.getElementById('c-big').textContent = t.closing.big;
  document.getElementById('c-tag').textContent = fill(t.closing.tag, nums);
  document.getElementById('c-b1').textContent = t.closing.b1;
  document.getElementById('c-b2').textContent = t.closing.b2;

  document.querySelectorAll('#langtabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });

  try{ localStorage.setItem('pexo-lang', lang); }catch(e){}
}

document.getElementById('langtabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  render(btn.dataset.lang);
});

let initialLang = 'es';
try{
  const saved = localStorage.getItem('pexo-lang');
  if(saved && T[saved]) initialLang = saved;
}catch(e){}
render(initialLang);
</script>
